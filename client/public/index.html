<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="AI Threat Detection Platform — Real-time cybersecurity monitoring powered by LSTM deep learning."
    />
    <title>AI Threat Detection Platform</title>
    <style>
      /* Base reset so the app has no white flash on dark dashboards */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        color: #e2e8f0;
      }
      #root { min-height: 100vh; }
      /* Simple loading spinner shown before React mounts */
      #initial-loader {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        gap: 16px;
        background: #0f172a;
      }
      #initial-loader .spinner {
        width: 48px; height: 48px;
        border: 4px solid #1e293b;
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #initial-loader p { color: #94a3b8; font-size: 14px; letter-spacing: 0.05em; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this application.</noscript>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <p>Loading AI Threat Detection Platform…</p>
      </div>
    </div>
  </body>
</html>
